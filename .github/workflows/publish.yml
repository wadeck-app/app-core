name: CI / Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version (e.g. 1.2.0)'
        required: false
        default: ''
      breaking:
        description: 'Breaking change?'
        required: false
        default: 'false'

permissions:
  contents: read
  packages: write

# packages/app-core-sdk and packages/app-core-cli are published -- packages/server
# and packages/frontend-shell are never published on their own: `npm run build`
# bundles the server code and the built frontend into app-core-cli (`serve`).
# sdk publishes first since cli depends on it
# (Decision #42: types-only sdk, cli as a separate global auto-updating binary).
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@wadeck-app'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build

      - run: npm run test:all

      - run: npm run test:violations-rules

  publish:
    needs: build-and-test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@wadeck-app'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: version
        uses: wadeck-app/ci-templates/.github/actions/compute-version@main
        with:
          version-input: ${{ github.event.inputs.version || '' }}
          breaking-input: ${{ github.event.inputs.breaking || 'false' }}

      - name: Inject version into app-core-sdk and app-core-cli
        run: |
          npm pkg set version="${{ steps.version.outputs.version }}" --workspace=packages/app-core-sdk
          npm pkg set version="${{ steps.version.outputs.version }}" --workspace=packages/app-core-cli
          npm pkg set dependencies.@wadeck-app/app-core-sdk="${{ steps.version.outputs.version }}" --workspace=packages/app-core-cli

      - run: npm run build

      - name: Publish app-core-sdk first (app-core-cli depends on it)
        working-directory: packages/app-core-sdk
        run: npm publish --tag ${{ steps.version.outputs.dist_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish app-core-cli
        working-directory: packages/app-core-cli
        run: npm publish --tag ${{ steps.version.outputs.dist_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
