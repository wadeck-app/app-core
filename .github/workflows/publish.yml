name: CI / Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version (e.g. 1.2.0)'
        required: false
        default: ''
      breaking:
        description: 'Breaking change?'
        required: false
        default: 'false'

permissions:
  contents: read
  packages: write

# Only packages/app-core-sdk is published -- packages/server and
# packages/frontend-shell are app-core's own internal implementation, never
# installed by anyone else.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@wadeck-app'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build

      - run: npm run test:all

      - run: npm run test:violations-rules

  publish:
    needs: build-and-test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@wadeck-app'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: version
        uses: wadeck-app/ci-templates/.github/actions/compute-version@main
        with:
          version-input: ${{ github.event.inputs.version || '' }}
          breaking-input: ${{ github.event.inputs.breaking || 'false' }}

      - name: Inject version into app-core-sdk
        run: npm pkg set version="${{ steps.version.outputs.version }}" --workspace=packages/app-core-sdk

      - run: npm run build

      - name: Publish app-core-sdk
        working-directory: packages/app-core-sdk
        run: npm publish --tag ${{ steps.version.outputs.dist_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
