name: CI / Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version (e.g. 1.2.0)'
        required: false
        default: ''
      breaking:
        description: 'Breaking change?'
        required: false
        default: 'false'

permissions:
  contents: read
  packages: write

# packages/app-core-sdk and packages/app-core-cli are published -- packages/server
# and packages/frontend-shell are never published on their own: `npm run build`
# bundles the server code and the built frontend into app-core-cli (`serve`).
# sdk publishes first since cli depends on it
# (Decision #42: types-only sdk, cli as a separate global auto-updating binary).
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@wadeck-app'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Patch-pinned like tray-go/go.mod: a new Go patch changes the binary's hash, which republishes the three platform
      # packages on its own and moves the exact pin a rollback needs. Bump it together with tray-go/go.mod.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false

      - run: npm run build

      - name: Build tray binaries
        run: npm run build-tray --workspace=packages/app-core-cli

      - name: Vet tray-go
        working-directory: packages/app-core-cli/tray-go
        run: go vet ./...

      - run: npm run test:all

      - run: npm run test:violations-rules

  publish:
    needs: build-and-test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@wadeck-app'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: version
        uses: wadeck-app/ci-templates/.github/actions/compute-version@main
        with:
          version-input: ${{ github.event.inputs.version || '' }}
          breaking-input: ${{ github.event.inputs.breaking || 'false' }}

      - name: Inject version into app-core-sdk and app-core-cli
        run: |
          npm pkg set version="${{ steps.version.outputs.version }}" --workspace=packages/app-core-sdk
          npm pkg set version="${{ steps.version.outputs.version }}" --workspace=packages/app-core-cli
          npm pkg set dependencies.@wadeck-app/app-core-sdk="${{ steps.version.outputs.version }}" --workspace=packages/app-core-cli

      # Patch-pinned like tray-go/go.mod: a new Go patch changes the binary's hash, which republishes the three platform
      # packages on its own and moves the exact pin a rollback needs. Bump it together with tray-go/go.mod.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false

      - run: npm run build

      - name: Build tray binaries
        run: npm run build-tray --workspace=packages/app-core-cli

      - name: Generate platform package directories
        run: bash packages/app-core-cli/ci/scripts/generate-platform-packages.sh

      - name: Copy tray binaries to platform packages
        run: bash packages/app-core-cli/ci/scripts/copy-binaries.sh

      # Publishes a platform package only when its binary changed, then pins the exact resolved versions into
      # app-core-cli's optionalDependencies: updating app-core-cli updates the tray iff the pin moved.
      - name: Publish platform packages (only if the tray binary changed) and pin them
        run: |
          bash packages/app-core-cli/ci/scripts/publish-platform-packages.sh \
            "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish app-core-sdk first (app-core-cli depends on it)
        working-directory: packages/app-core-sdk
        run: npm publish --tag ${{ steps.version.outputs.dist_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish app-core-cli
        working-directory: packages/app-core-cli
        run: npm publish --tag ${{ steps.version.outputs.dist_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
